<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Public Dashboard — Abia Migration Observatory</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="/">Abia Migration Observatory</a>
      <a class="btn btn-outline-light btn-sm" href="/">Home</a>
    </div>
  </nav>

  <div class="container my-5">
    <h2 class="mb-4">Public Dashboard</h2>
    <p class="text-muted">Live high-level statistics (no login required)</p>

    <div class="row g-4 mb-5">
      <div class="col-md-4">
        <div class="card text-center shadow-sm">
          <div class="card-body">
            <h3 class="display-6 text-primary">{{ total_migrants }}</h3>
            <p class="mb-0">Total Migrants</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card text-center shadow-sm">
          <div class="card-body">
            <h3 class="display-6 text-warning">{{ open_cases }}</h3>
            <p class="mb-0">Open Cases</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card text-center shadow-sm">
          <div class="card-body">
            <h3 class="display-6 text-success">{{ resolved_cases }}</h3>
            <p class="mb-0">Resolved Cases</p>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5>Total Cases</h5>
            <p class="display-6">{{ total_cases }}</p>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5>New This Week</h5>
            <p class="display-6">{{ new_this_week }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
