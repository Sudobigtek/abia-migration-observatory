<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Command Center — Abia Migration Observatory</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">Abia Command Center</a>
      <a class="btn btn-outline-light btn-sm" href="/public-dashboard/">Public View</a>
    </div>
  </nav>
  <div class="container my-5">
    <h2 class="mb-4">Command Center</h2>
    <div class="row g-4">
      <div class="col-md-3">
        <div class="card text-center border-primary">
          <div class="card-body">
            <h3 class="text-primary">{{ total_migrants }}</h3>
            <small>Total Migrants</small>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-center border-info">
          <div class="card-body">
            <h3 class="text-info">{{ new_migrants_this_week }}</h3>
            <small>New This Week</small>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-center border-warning">
          <div class="card-body">
            <h3 class="text-warning">{{ open_cases }}</h3>
            <small>Open Cases</small>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-center border-danger">
          <div class="card-body">
            <h3 class="text-danger">{{ high_priority_cases }}</h3>
            <small>High Priority</small>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
