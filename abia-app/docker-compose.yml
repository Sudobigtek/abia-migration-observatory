version: "3.8"

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: abia
      POSTGRES_USER: abia
      POSTGRES_PASSWORD: abia
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=abia.settings.development
      - DB_HOST=db
      - DB_NAME=abia
      - DB_USER=abia
      - DB_PASSWORD=abia
    depends_on:
      - db

volumes:
  postgres_data:
