<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Select Portal | Abia Migration Observatory</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f8f9fa}
.portal-card{cursor:pointer;transition:all .25s}
.portal-card:hover{transform:translateY(-6px);box-shadow:0 12px 32px rgba(0,0,0,.12)}
</style>
</head>
<body>
<div class="container py-5"><div class="text-center mb-5">
<h1 class="display-5 fw-bold">Select Your Portal</h1>
<p class="lead text-muted">Abia State Migration Observatory</p>
</div>
<div class="row justify-content-center g-4">
<div class="col-md-4"><a href="/command-center/" class="text-decoration-none">
<div class="card portal-card h-100 text-center p-5">
<h3 class="text-dark">Government</h3>
<p class="text-muted">Command Center for officials.</p>
<span class="btn btn-primary mt-auto">Enter Command Center</span>
</div></a></div>
<div class="col-md-4"><a href="/reports/" class="text-decoration-none">
<div class="card portal-card h-100 text-center p-5">
<h3 class="text-dark">Partner</h3>
<p class="text-muted">Reports for partner organizations.</p>
<span class="btn btn-success mt-auto">Enter Partner Portal</span>
</div></a></div>
<div class="col-md-4"><a href="/dashboard/" class="text-decoration-none">
<div class="card portal-card h-100 text-center p-5">
<h3 class="text-dark">Public</h3>
<p class="text-muted">Open dashboard with public data.</p>
<span class="btn btn-info text-white mt-auto">View Public Dashboard</span>
</div></a></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
