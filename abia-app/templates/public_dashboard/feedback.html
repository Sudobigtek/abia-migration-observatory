{% extends "base.html" %}
{% block title %}Submit Feedback | Abia Observatory{% endblock %}
{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0 animate-card">
                <div class="card-header bg-primary text-white py-3">
                    <h3 class="mb-0 fw-bold"><i class="bi bi-chat-left-text-fill me-2"></i>Submit Feedback</h3>
                </div>
                <div class="card-body p-4 p-md-5">
                    <p class="text-muted mb-4">Share your experience, report issues, or request assistance. All submissions are reviewed by the Observatory team.</p>
                    <form method="post" action="">
                        {% csrf_token %}
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Full Name</label>
                                <input type="text" name="name" class="form-control form-control-lg" placeholder="Your full name" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Email Address</label>
                                <input type="email" name="email" class="form-control form-control-lg" placeholder="you@example.com" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Phone Number</label>
                                <input type="tel" name="phone" class="form-control form-control-lg" placeholder="+234 800 000 0000">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Category</label>
                                <select name="category" class="form-select form-select-lg" required>
                                    <option value="">Select category...</option>
                                    <option value="general">General Inquiry</option>
                                    <option value="complaint">Complaint</option>
                                    <option value="assistance">Request Assistance</option>
                                    <option value="data">Data Correction</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Message</label>
                                <textarea name="message" class="form-control" rows="5" placeholder="Describe your feedback in detail..." required></textarea>
                            </div>
                            <div class="col-12 d-flex gap-3 mt-4">
                                <button type="submit" class="btn btn-primary btn-lg px-5">
                                    <i class="bi bi-send-fill me-2"></i>Submit Feedback
                                </button>
                                <a href="{% url 'public_dashboard:public_landing' %}" class="btn btn-outline-secondary btn-lg">
                                    <i class="bi bi-x-lg me-2"></i>Cancel
                                </a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
