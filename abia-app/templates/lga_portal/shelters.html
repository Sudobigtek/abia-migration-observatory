{% extends "lga_portal/base_lga.html" %}
{% block content %}
<div class="container py-4">
    <h4 class="fw-bold mb-3">{{ lga.name }} — Safe Houses</h4>
    <div class="row g-3">
        {% for s in shelters %}
        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">{{ s.name }}</h5>
                    <p class="card-text small text-muted">{{ s.address }}</p>
                    <div class="d-flex justify-content-between">
                        <span class="badge bg-primary">Capacity: {{ s.capacity }}</span>
                        <span class="badge bg-{% if s.available_beds > 0 %}success{% else %}danger{% endif %}">Available: {{ s.available_beds }}</span>
                    </div>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12 text-center py-4 text-muted">No shelters registered in this LGA.</div>
        {% endfor %}
    </div>
</div>
{% endblock %}
