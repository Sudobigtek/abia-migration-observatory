{% extends "drf_spectacular/swagger_ui.html" %}

{% block head %}
{{ block.super }}
<style>
  body { background-color: #f4f7f6; font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .swagger-ui .topbar { background: linear-gradient(90deg, #008751 0%, #006400 100%); padding: 12px 0; }
  .swagger-ui .topbar a { display: none; }
  .swagger-ui .info .title { color: #006400; font-size: 28px; font-weight: 800; }
  .swagger-ui .info .title small { background: #008751; border-radius: 12px; padding: 4px 10px; font-weight: 700; }
  .swagger-ui .scheme-container { background: #e8f5e9; box-shadow: none; border-bottom: 3px solid #008751; }
  .swagger-ui .btn.authorize { background-color: #008751; border-color: #008751; }
  .swagger-ui .opblock.opblock-get { background: rgba(0,135,81,0.07); border-left: 5px solid #008751; }
  .swagger-ui .opblock.opblock-get .opblock-summary-method { background: #008751; }
  .swagger-ui .opblock.opblock-post { background: rgba(255,152,0,0.07); border-left: 5px solid #ff9800; }
  .swagger-ui .opblock.opblock-post .opblock-summary-method { background: #ff9800; }
  .swagger-ui .opblock-tag { font-size: 20px; font-weight: 700; color: #006400; border-bottom: 2px solid #008751; }
</style>
{% endblock %}
